<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (matching MTS #667eea -> #764ba2 with vibrant depth) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Base Strand Gradient -->
    <linearGradient id="strandBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Soft Base Strand Shadow -->
    <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>

    <!-- Crossover Overlap 3D Drop Shadow -->
    <filter id="crossoverShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.65"/>
    </filter>

    <!-- Golden Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FDE047" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Squircle Outer Shell -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Glass Border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="6"/>

  <!-- Ambient Light Center -->
  <circle cx="256" cy="256" r="190" fill="url(#coreGlow)"/>

  <!-- 1. BASE CONTINUOUS STRANDS -->
  <g stroke="url(#strandBase)" stroke-width="25" stroke-linecap="round" fill="none" filter="url(#baseShadow)">
    <path d="M 342.00 96.00 C 342.00 102.67, 339.76 109.33, 335.45 116.00 C 331.15 122.67, 324.77 129.33, 316.81 136.00 C 308.85 142.67, 299.31 149.33, 288.91 156.00 C 278.51 162.67, 267.26 169.33, 256.00 176.00 C 244.74 182.67, 233.49 189.33, 223.09 196.00 C 212.69 202.67, 203.15 209.33, 195.19 216.00 C 187.23 222.67, 180.85 229.33, 176.55 236.00 C 172.24 242.67, 170.00 249.33, 170.00 256.00 C 170.00 262.67, 172.24 269.33, 176.55 276.00 C 180.85 282.67, 187.23 289.33, 195.19 296.00 C 203.15 302.67, 212.69 309.33, 223.09 316.00 C 233.49 322.67, 244.74 329.33, 256.00 336.00 C 267.26 342.67, 278.51 349.33, 288.91 356.00 C 299.31 362.67, 308.85 369.33, 316.81 376.00 C 324.77 382.67, 331.15 389.33, 335.45 396.00 C 339.76 402.67, 342.00 409.33, 342.00 416.00"/>
    <path d="M 170.00 96.00 C 170.00 102.67, 172.24 109.33, 176.55 116.00 C 180.85 122.67, 187.23 129.33, 195.19 136.00 C 203.15 142.67, 212.69 149.33, 223.09 156.00 C 233.49 162.67, 244.74 169.33, 256.00 176.00 C 267.26 182.67, 278.51 189.33, 288.91 196.00 C 299.31 202.67, 308.85 209.33, 316.81 216.00 C 324.77 222.67, 331.15 229.33, 335.45 236.00 C 339.76 242.67, 342.00 249.33, 342.00 256.00 C 342.00 262.67, 339.76 269.33, 335.45 276.00 C 331.15 282.67, 324.77 289.33, 316.81 296.00 C 308.85 302.67, 299.31 309.33, 288.91 316.00 C 278.51 322.67, 267.26 329.33, 256.00 336.00 C 244.74 342.67, 233.49 349.33, 223.09 356.00 C 212.69 362.67, 203.15 369.33, 195.19 376.00 C 187.23 382.67, 180.85 389.33, 176.55 396.00 C 172.24 402.67, 170.00 409.33, 170.00 416.00"/>
  </g>

