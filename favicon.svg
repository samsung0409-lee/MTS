fill="rgba(255,255,255,0.95)"/> <line x1="209.92" y1="364.8" x2="250.5" y2="364.8" stroke="#FFB703" stroke-width="17" stroke-linecap="round"/> <line x1="261.5" y1="364.8" x2="302.08" y2="364.8" stroke="#00F5A0" stroke-width="17" stroke-linecap="round"/> <circle cx="256" cy="364.8" r="3.5" fill="rgba(255,255,255,0.95)"/> <line x1="180.64" y1="390.4" x2="250.5" y2="390.4" stroke="#C084FC" stroke-width="17" stroke-linecap="round"/> <line x1="261.5" y1="390.4" x2="331.36" y2="390.4" stroke="#38BDF8" stroke-width="17" stroke-linecap="round"/> <circle cx="256" cy="390.4" r="3.5" fill="rgba(255,255,255,0.95)"/>
  </g>

  <!-- 3. RUNGS NODES (Connection Spheres) -->
  <g id="nodes">
    <circle cx="180.64" cy="121.6" r="11" fill="#FF3B69"/> <circle cx="180.64" cy="121.6" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="331.36" cy="121.6" r="11" fill="#00F0FF"/> <circle cx="331.36" cy="121.6" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="209.92" cy="147.2" r="11" fill="#FFB703"/> <circle cx="209.92" cy="147.2" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="302.08" cy="147.2" r="11" fill="#00F5A0"/> <circle cx="302.08" cy="147.2" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="209.92" cy="204.8" r="11" fill="#38BDF8"/> <circle cx="209.92" cy="204.8" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="302.08" cy="204.8" r="11" fill="#C084FC"/> <circle cx="302.08" cy="204.8" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="180.64" cy="230.4" r="11" fill="#FF3B69"/> <circle cx="180.64" cy="230.4" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="331.36" cy="230.4" r="11" fill="#00F0FF"/> <circle cx="331.36" cy="230.4" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="170.0" cy="256.0" r="11" fill="#FFB703"/> <circle cx="170.0" cy="256.0" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="342.0" cy="256.0" r="11" fill="#00F5A0"/> <circle cx="342.0" cy="256.0" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="180.64" cy="281.6" r="11" fill="#C084FC"/> <circle cx="180.64" cy="281.6" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="331.36" cy="281.6" r="11" fill="#38BDF8"/> <circle cx="331.36" cy="281.6" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="209.92" cy="307.2" r="11" fill="#00F0FF"/> <circle cx="209.92" cy="307.2" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="302.08" cy="307.2" r="11" fill="#FF3B69"/> <circle cx="302.08" cy="307.2" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="209.92" cy="364.8" r="11" fill="#FFB703"/> <circle cx="209.92" cy="364.8" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="302.08" cy="364.8" r="11" fill="#00F5A0"/> <circle cx="302.08" cy="364.8" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="180.64" cy="390.4" r="11" fill="#C084FC"/> <circle cx="180.64" cy="390.4" r="5" fill="#FFFFFF" opacity="0.9"/> <circle cx="331.36" cy="390.4" r="11" fill="#38BDF8"/> <circle cx="331.36" cy="390.4" r="5" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- 4. 3D CROSSOVER OVERLAYS (One strand crosses over the other & rungs) -->
  <g stroke="url(#strandBase)" stroke-width="26" stroke-linecap="round" fill="none" filter="url(#crossoverShadow)">
    <!-- Crossover 1: Strand 1 in front -->
    <path d="M 306.55 144.00 C 301.69 147.56, 296.46 151.11, 290.98 154.67 C 285.49 158.22, 279.75 161.78, 273.88 165.33 C 268.01 168.89, 262.00 172.44, 256.00 176.00 C 250.00 179.56, 243.99 183.11, 238.12 186.67 C 232.25 190.22, 226.51 193.78, 221.02 197.33 C 215.54 200.89, 210.31 204.44, 205.45 208.00"/>
    <!-- Crossover 2: Strand 2 in front -->
    <path d="M 306.55 304.00 C 301.69 307.56, 296.46 311.11, 290.98 314.67 C 285.49 318.22, 279.75 321.78, 273.88 325.33 C 268.01 328.89, 262.00 332.44, 256.00 336.00 C 250.00 339.56, 243.99 343.11, 238.12 346.67 C 232.25 350.22, 226.51 353.78, 221.02 357.33 C 215.54 360.89, 210.31 364.44, 205.45 368.00"/>
  </g>

  <!-- 5. TERMINAL SPHERES ON STRAND ENDS -->
  <circle cx="342" cy="96" r="14" fill="#FFFFFF" filter="url(#baseShadow)"/>
  <circle cx="170" cy="96" r="14" fill="#FFFFFF" filter="url(#baseShadow)"/>
  <circle cx="342" cy="416" r="14" fill="#FFFFFF" filter="url(#baseShadow)"/>
  <circle cx="170" cy="416" r="14" fill="#FFFFFF" filter="url(#baseShadow)"/>

  <!-- 6. LEARNING / EXCELLENCE SPARKLES -->
  <!-- Top Right Big Star (Academic / Quiz Mastery) -->
  <g transform="translate(394, 94)" filter="url(#starGlow)">
    <path d="M 0,-26 Q 0,0 26,0 Q 0,0 0,26 Q 0,0 -26,0 Q 0,0 0,-26 Z" fill="#FFD166"/>
    <circle cx="0" cy="0" r="5.5" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Left Star (Science Sparkle) -->
  <g transform="translate(108, 412)" opacity="0.95">
    <path d="M 0,-17 Q 0,0 17,0 Q 0,0 0,17 Q 0,0 -17,0 Q 0,0 0,-17 Z" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Top Left Soft Dot -->
  <circle cx="116" cy="116" r="5.5" fill="#FFFFFF" opacity="0.75"/>

  <!-- Bottom Right Subtle Sparkle -->
  <g transform="translate(402, 396)" opacity="0.8">
    <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" fill="#FFD166"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
